name: One-time Delveworn naming cleanup

on:
  push:
    branches:
      - cleanup/delveworn-naming
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rename:
    if: github.event_name == 'push' || github.head_ref == 'cleanup/delveworn-naming'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: cleanup/delveworn-naming
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Rename project symbols and verify
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -f src/RiseDungeon.sol ]]; then
            git mv -- src/RiseDungeon.sol src/Delveworn.sol
          fi

          if [[ -f test/RiseDungeon.t.sol ]]; then
            git mv -- test/RiseDungeon.t.sol test/Delveworn.t.sol
          fi

          while IFS= read -r -d '' file; do
            perl -0pi -e 's/RiseDungeon/Delveworn/g; s/RISE Dungeon/Delveworn/g; s/RISE DUNGEON/DELVEWORN/g' "$file"
          done < <(git grep -Ilz -e 'RiseDungeon' -e 'RISE Dungeon' -e 'RISE DUNGEON' -- ':!.github/workflows/rename-delveworn-once.yml' || true)

          forge fmt
          forge build --sizes
          forge test -q

          git rm -- .github/workflows/rename-delveworn-once.yml

          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --

          echo "Changed files:"
          git status --short

          git commit -m "refactor: rename RiseDungeon to Delveworn"
          git push origin HEAD:cleanup/delveworn-naming
