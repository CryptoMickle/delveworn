name: Fix Relics V2 Tests

permissions:
  contents: write

on:
  push:
    branches:
      - feature/relics-v2-rarities

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/relics-v2-rarities
      - name: Update balance harnesses for rarity offers
        run: |
          python - <<'PY'
          from pathlib import Path

          baseline = Path("test/BalanceBaseline.t.sol")
          text = baseline.read_text()
          old = "function testPreRelicConservativeAttackBaseline() public {"
          new = "function testPreRelicConservativeAttackBaseline() public noGasMetering {"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Baseline test signature not found")
          baseline.write_text(text)

          path = Path("test/RelicBalance.t.sol")
          text = path.read_text()

          marker = 'import {DevRandomnessAdapter} from "../src/adapters/DevRandomnessAdapter.sol";\n\n'
          harness = '''import {DevRandomnessAdapter} from "../src/adapters/DevRandomnessAdapter.sol";\n\ncontract RelicBalanceDungeon is Delveworn {\n    constructor(address coordinatorAddress) Delveworn(coordinatorAddress) {}\n\n    function forceRelicOfferRarity(address playerAddress, RelicRarity rarity) external {\n        relicOfferRarity[playerAddress] = rarity;\n    }\n}\n\n'''
          if "contract RelicBalanceDungeon" not in text:
              if marker not in text:
                  raise SystemExit("RelicBalance import marker not found")
              text = text.replace(marker, harness, 1)

          text = text.replace("Delveworn internal dungeon;", "RelicBalanceDungeon internal dungeon;", 1)
          text = text.replace(
              "dungeon = new Delveworn(address(adapter));",
              "dungeon = new RelicBalanceDungeon(address(adapter));",
              1,
          )

          choose = '''            if (\n                dungeon.relicOfferAvailable(playerAddress)\n                    && dungeon.equippedRelic(playerAddress) == Delveworn.Relic.None\n            ) {\n                vm.prank(playerAddress);\n                dungeon.chooseRelic(relic);\n            }'''
          choose_v2 = '''            if (\n                dungeon.relicOfferAvailable(playerAddress)\n                    && dungeon.equippedRelic(playerAddress) == Delveworn.Relic.None\n            ) {\n                // This legacy telemetry suite measures the calibrated Common tier.\n                // Production offers remain rarity-locked; the test-only subclass\n                // pins the offer to Common without changing any VRF combat/loot words.\n                dungeon.forceRelicOfferRarity(playerAddress, Delveworn.RelicRarity.Common);\n                vm.prank(playerAddress);\n                dungeon.chooseRelic(relic);\n            }'''
          if choose in text:
              text = text.replace(choose, choose_v2, 1)
          elif "forceRelicOfferRarity" not in text[text.find("function _playRun"):]:
              raise SystemExit("Relic choose block not found")

          path.write_text(text)
          PY
          forge fmt test/BalanceBaseline.t.sol test/RelicBalance.t.sol
      - name: Commit test harness updates
        run: |
          if git diff --quiet; then
            echo "No test changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/BalanceBaseline.t.sol test/RelicBalance.t.sol
          git commit -m "Adapt balance harnesses for Relics V2"
          git push origin HEAD:feature/relics-v2-rarities
