name: Diagnose Final Balance

permissions: {}

on:
  pull_request:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Relics V1 unit tests
        run: forge test --match-path test/RelicsV1.t.sol -vv

      - name: Relic balance tests
        if: always()
        run: forge test --match-path test/RelicBalance.t.sol -vv

      - name: Existing core tests
        if: always()
        run: forge test --match-path test/Delveworn.t.sol -vv

      - name: Baseline tests
        if: always()
        run: forge test --match-path test/BalanceBaseline.t.sol -vv
