name: Fix Relic Retry Expectation

permissions:
  contents: write

on:
  push:
    branches:
      - balance/relics-v1-calibration

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: balance/relics-v1-calibration

      - name: Fix Blood Price retry expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("test/RelicsV1.t.sol")
          text = path.read_text()
          old = "assertEq(dungeon.maxHp(player), 97);"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 stale retry assertions, found {count}")
          path.write_text(text.replace(old, "assertEq(dungeon.maxHp(player), 98);"))
          PY

      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/RelicsV1.t.sol
          git commit -m "Fix Blood Price retry regression expectation"
          git push origin HEAD:balance/relics-v1-calibration
