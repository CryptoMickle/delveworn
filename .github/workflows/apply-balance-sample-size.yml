name: Apply Balance Sample Size

permissions:
  contents: write

on:
  push:
    branches:
      - balance/relics-v1-calibration

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: balance/relics-v1-calibration

      - name: Increase calibration sample size
        run: |
          python - <<'PY'
          from pathlib import Path

          baseline = Path("test/BalanceBaseline.t.sol")
          text = baseline.read_text()
          text = text.replace("uint256 internal constant RUNS = 32;", "uint256 internal constant RUNS = 128;", 1)
          text = text.replace(
              "function testPreRelicConservativeAttackBaseline() public {",
              "function testPreRelicConservativeAttackBaseline() public noGasMetering {",
              1,
          )
          baseline.write_text(text)

          relic = Path("test/RelicBalance.t.sol")
          text = relic.read_text()
          text = text.replace("uint256 internal constant RUNS = 32;", "uint256 internal constant RUNS = 128;", 1)
          relic.write_text(text)
          PY

      - name: Commit sample-size update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/BalanceBaseline.t.sol test/RelicBalance.t.sol
          git commit -m "Increase matched balance calibration sample"
          git push origin HEAD:balance/relics-v1-calibration
