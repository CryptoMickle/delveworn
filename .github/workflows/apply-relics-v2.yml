name: Apply Relics V2

permissions:
  contents: write

on:
  push:
    branches:
      - feature/relics-v2-rarities

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/relics-v2-rarities

      - name: Apply Relics V2 integration
        run: python script/apply_relics_v2.py

      - name: Commit integrated contract
        run: |
          if git diff --quiet; then
            echo "No contract changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Delveworn.sol
          git commit -m "Integrate Relics V2 rarity system"
          git push origin HEAD:feature/relics-v2-rarities
