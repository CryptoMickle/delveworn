name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Balance baseline tests
        run: forge test --match-path test/BalanceBaseline.t.sol -vv

      - name: Run Chainlink V2.5 adapter tests
        run: forge test --match-path test/ChainlinkV25DirectFundingAdapter.t.sol -vv

      - name: Run Delveworn core tests
        run: forge test --match-path test/Delveworn.t.sol -vv

      - name: Run dev randomness adapter tests
        run: forge test --match-path test/DevRandomnessAdapter.t.sol -vv

      - name: Run legacy VRF adapter tests
        run: forge test --match-path test/LegacyVRFAdapter.t.sol -vv

      - name: Capture failing relic balance diagnostics
        if: always()
        run: |
          set +e
          forge test --match-path test/RelicBalance.t.sol --match-test testBloodPriceBalance -vvvv > blood-price.txt 2>&1
          echo $? > blood-price.exit
          forge test --match-path test/RelicBalance.t.sol --match-test testEchoLensBalance -vvvv > echo-lens.txt 2>&1
          echo $? > echo-lens.exit
          exit 0

      - name: Upload relic balance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relic-balance-diagnostics
          path: |
            blood-price.txt
            blood-price.exit
            echo-lens.txt
            echo-lens.exit

      - name: Run Iron Shell balance
        if: always()
        run: forge test --match-path test/RelicBalance.t.sol --match-test testIronShellBalance -vv

      - name: Run Relics V1 tests
        if: always()
        run: forge test --match-path test/RelicsV1.t.sol -vv
