name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Capture balance telemetry
        run: |
          forge test --match-path test/BalanceBaseline.t.sol -vv > balance-baseline.txt 2>&1
          forge test --match-path test/RelicBalance.t.sol -vv > relic-balance.txt 2>&1

      - name: Upload balance telemetry
        uses: actions/upload-artifact@v4
        with:
          name: balance-telemetry
          path: |
            balance-baseline.txt
            relic-balance.txt
