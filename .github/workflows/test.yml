name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Diagnose Relics V1 tests
        continue-on-error: true
        run: forge test --match-path test/RelicsV1.t.sol -vv

      - name: Diagnose relic balance tests
        continue-on-error: true
        run: forge test --match-path test/RelicBalance.t.sol -vv

      - name: Diagnose existing test suite
        continue-on-error: true
        run: forge test --no-match-path 'test/(RelicsV1|RelicBalance)\.t\.sol' -vv

      - name: Run Forge tests serially
        run: forge test --threads 1 -vvv
