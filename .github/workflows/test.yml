name: Contracts CI

permissions: {}

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - ".gitmodules"
      - "foundry.toml"
      - "foundry.lock"
      - "remappings.txt"
      - "lib/**"
      - "script/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - ".gitmodules"
      - "foundry.toml"
      - "foundry.lock"
      - "remappings.txt"
      - "lib/**"
      - "script/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
  workflow_dispatch:

jobs:
  check:
    name: Foundry checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      - name: Run contract tests
        run: forge test -vvv
