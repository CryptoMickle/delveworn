name: Balance Calibration

permissions: {}

on:
  pull_request:
  workflow_dispatch:

jobs:
  balance:
    name: Fresh-state matched relic telemetry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run fresh-state matched balance telemetry
        run: forge test --match-path test/RelicBalanceFreshMatched.t.sol -vv > fresh-matched-balance.txt 2>&1

      - name: Upload fresh-state matched balance telemetry
        uses: actions/upload-artifact@v4
        with:
          name: fresh-matched-balance-telemetry
          path: fresh-matched-balance.txt
