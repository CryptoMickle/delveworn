name: Balance Calibration

permissions: {}

on:
  pull_request:
  workflow_dispatch:

jobs:
  balance:
    name: Matched relic telemetry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run matched balance telemetry
        run: |
          forge test --match-path test/BalanceBaseline.t.sol -vv > balance-baseline.txt 2>&1
          forge test --match-path test/RelicBalanceMatched.t.sol --match-test testMatched -vv > relic-balance-matched.txt 2>&1

      - name: Upload matched balance telemetry
        uses: actions/upload-artifact@v4
        with:
          name: matched-balance-telemetry
          path: |
            balance-baseline.txt
            relic-balance-matched.txt
